<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planflow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Planflow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Ccircle cx='9' cy='9' r='3.5' fill='%2358a6ff'/%3E%3Ccircle cx='9' cy='23' r='3.5' fill='%2358a6ff'/%3E%3Ccircle cx='23' cy='16' r='3.5' fill='%232ea043'/%3E%3Cpath d='M12 9.5 20 15M12 22.5 20 17' stroke='%238b949e' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<!-- Day or dark mode, decided before the first paint so the page never flashes the other one:
     the saved choice (the ☀/☾ button in the top bar), else what the system prefers. -->
<script>(function () { try { var t = localStorage.getItem('planflow.theme'); if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.dataset.theme = t; } catch (e) {} })();</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="topbar">
  <a class="brand" href="#/" title="All plans (home)">
    <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><circle cx="9" cy="9" r="3.5" fill="#58a6ff"/><circle cx="9" cy="23" r="3.5" fill="#58a6ff"/><circle cx="23" cy="16" r="3.5" fill="#2ea043"/><path d="M12 9.5 20 15M12 22.5 20 17" stroke="#8b949e" stroke-width="2" fill="none"/></svg>
    <span>Planflow</span>
  </a>
  <select id="boardSelect" title="Switch board"></select>
  <button id="btnBoardMenu" class="icon" title="Board options" aria-label="Board options">⋯</button>
  <div id="progress" title="Done / total"><div class="bar"></div><span class="label"></span></div>
  <div class="spacer"></div>
  <button id="btnNewBoard" class="primary home-only" title="Start a new plan (N)">+ New plan</button>
  <button id="btnAdd" class="primary" title="Add a task (N)">+ Task</button>
  <button id="btnArrange" title="Auto arrange (A)">Arrange</button>
  <button id="btnFit" title="Fit to view (F)">Fit</button>
  <button id="btnList" class="mobile-only" title="Board as a list, or the canvas" aria-pressed="false">List</button>
  <button id="btnTheme" class="icon" title="Day mode" aria-label="Switch between day and dark mode">☀</button>
</header>

<!-- Home: every plan as a card (its flow sketched on a coloured thumbnail), the archive box bottom left. -->
<section id="home">
  <div class="home-head"><h1>Your plans</h1><span id="homeCount" class="muted"></span></div>
  <div id="planGrid"></div>
</section>
<button id="archiveBox" title="Drop a plan here to archive it. Click to see archived plans." aria-label="Archive box">
  <svg viewBox="0 0 120 100" aria-hidden="true">
    <rect class="box-inside" x="22" y="34" width="76" height="16" rx="2"/>
    <rect class="box-front" x="18" y="44" width="84" height="46" rx="3"/>
    <rect class="box-tape" x="56" y="44" width="8" height="46"/>
    <rect class="box-rim" x="16" y="42" width="88" height="7" rx="2"/>
    <g class="flap flap-l"><rect x="18" y="36" width="44" height="9" rx="2"/></g>
    <g class="flap flap-r"><rect x="58" y="36" width="44" height="9" rx="2"/></g>
  </svg>
  <span class="archive-label">Archive</span>
  <span class="archive-count" hidden>0</span>
</button>
<div id="archiveDrawer" hidden></div>

<main>
  <div id="viewport">
    <div id="world">
      <svg id="edges" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow-pending" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" class="mk pending"/></marker>
          <marker id="arrow-satisfied" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" class="mk satisfied"/></marker>
          <marker id="arrow-selected" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" class="mk selected"/></marker>
          <marker id="arrow-temp" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" class="mk temp"/></marker>
        </defs>
        <g id="edgeLayer"></g>
      </svg>
      <div id="nodes"></div>
      <button id="edgeUnlink" hidden title="Remove this link">✕ Unlink</button>
    </div>
    <div id="hint">Right-click for actions · double-click or middle-click empty space to add a task and type its name · paste an image or a link to give a card a cover · drag a <b>●</b> handle (any side) onto another task to make it wait for this one · scroll to zoom, drag to pan</div>
    <div id="zoomLabel" title="Zoom">100%</div>
  </div>
  <aside id="panel"></aside>
</main>

<div id="boardMenu" class="menu" hidden>
  <button data-act="new">New board</button>
  <button data-act="rename">Rename board</button>
  <button data-act="archive">Archive board</button>
  <button data-act="delete" class="danger">Delete board</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
