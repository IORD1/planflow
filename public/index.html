<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Planflow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Ccircle cx='9' cy='9' r='3.5' fill='%2358a6ff'/%3E%3Ccircle cx='9' cy='23' r='3.5' fill='%2358a6ff'/%3E%3Ccircle cx='23' cy='16' r='3.5' fill='%232ea043'/%3E%3Cpath d='M12 9.5 20 15M12 22.5 20 17' stroke='%238b949e' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand" title="Planflow">
    <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><circle cx="9" cy="9" r="3.5" fill="#58a6ff"/><circle cx="9" cy="23" r="3.5" fill="#58a6ff"/><circle cx="23" cy="16" r="3.5" fill="#2ea043"/><path d="M12 9.5 20 15M12 22.5 20 17" stroke="#8b949e" stroke-width="2" fill="none"/></svg>
    <span>Planflow</span>
  </div>
  <select id="boardSelect" title="Switch board"></select>
  <button id="btnBoardMenu" class="icon" title="Board options" aria-label="Board options">⋯</button>
  <div id="progress" title="Done / total"><div class="bar"></div><span class="label"></span></div>
  <div class="spacer"></div>
  <button id="btnAdd" class="primary" title="Add a task (N)">+ Task</button>
  <button id="btnArrange" title="Auto arrange (A)">Arrange</button>
  <button id="btnFit" title="Fit to view (F)">Fit</button>
  <button id="btnPanel" class="icon mobile-only" title="Toggle panel" aria-label="Toggle panel">☰</button>
</header>

<main>
  <div id="viewport">
    <div id="world">
      <svg id="edges" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow-pending" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#5b6470"/></marker>
          <marker id="arrow-satisfied" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#2ea043"/></marker>
          <marker id="arrow-selected" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#f0883e"/></marker>
          <marker id="arrow-temp" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 z" fill="#58a6ff"/></marker>
        </defs>
        <g id="edgeLayer"></g>
      </svg>
      <div id="nodes"></div>
      <button id="edgeUnlink" hidden title="Remove this link">✕ Unlink</button>
    </div>
    <div id="hint">Right-click for actions · double-click or middle-click empty space to add a task · drag a <b>●</b> handle (any side) onto another task to make it wait for this one · scroll to zoom, drag to pan</div>
    <div id="zoomLabel" title="Zoom">100%</div>
  </div>
  <aside id="panel"></aside>
</main>

<div id="boardMenu" class="menu" hidden>
  <button data-act="new">New board</button>
  <button data-act="rename">Rename board</button>
  <button data-act="delete" class="danger">Delete board</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
