# Checkouts that auto-deploy pulls and rebuilds, one per line: <absolute dir> [branch]
# Each dir must contain a docker-compose.yml and may be a subfolder of a repo
# (the IORD1/homelab repo holds several stacks). Lives on the server as
# ~/.local/state/autodeploy/autodeploy.conf, where Hermes' Deploys page edits it;
# this copy is the starting point for a fresh install.
/home/iord/planflow main
/home/iord/homelab/postgres main
/home/iord/homelab/redis main
/home/iord/homelab/sure main
/home/iord/homelab/securo main
/home/iord/hermes main
